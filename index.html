er a trust to hold assets for minors, who cannot give a valid receipt. Mark N/A if there are no minor children."},{id:"insurance",group:"Beneficiary designations",title:e?"Takaful / life insurance nominations":"Life insurance nominations",why:t==="SG"?"Nominations sit outside the will. A trust nomination under the Insurance Act creates a statutory trust for the proceeds and is only valid for a spouse or children \u2014 it also generally needs every nominee\u2019s consent (or a court order) to change. A revocable nomination is flexible, but the insurer pays out according to the latest valid nomination or will. Set the nomination type on each policy in the Assets tab, and review it again after a marriage, divorce, birth or death.":`Nominations sit outside the will. Check the nomination type on each policy and whether the nominee holds as trustee or beneficial owner, and review it again after a marriage, divorce, birth or death. If a policy was bought in Singapore while working there, mark it "Held outside Malaysia" in the Assets tab \u2014 Singapore's Insurance Act treats a trust nomination differently (valid only for a spouse or children) from a Malaysian one.`},{id:"retirement",group:"Beneficiary designations",title:t==="SG"?"CPF nomination":"EPF nomination",why:t==="SG"?`CPF savings pass by nomination made with the CPF Board, not by the will.${e?" For Muslim members, confirm how the CPF Board applies Muslim law to the nomination.":""} Marriage automatically revokes an existing CPF nomination \u2014 divorce does not. Review and, if needed, resubmit the nomination after marriage, birth or divorce.`:`EPF savings pass to the nominees on record, not by the will.${e?" For Muslims, confirm how nominees hold the funds relative to faraid.":""} Unlike CPF in Singapore, an EPF nomination is not automatically cancelled by marriage or divorce \u2014 members must update it themselves. Review after marriage, birth or divorce. If they also have Singapore CPF savings from working there, record it as a separate asset and mark it "Held outside Malaysia" \u2014 CPF follows different rules (marriage automatically revokes a CPF nomination; EPF does not).`},{id:"joint",group:"Beneficiary designations",title:"Jointly-owned assets reviewed",why:"Property and accounts held as joint tenants pass to the survivor automatically. Tenants-in-common shares fall into the estate. Check how each is held."},{id:"living_trust",group:"Trusts and structures",title:"Living (inter vivos) trust",why:"Holds assets during life and after death. Can avoid probate delay, add conditions, and protect minors or vulnerable beneficiaries."},{id:"testamentary_trust",group:"Trusts and structures",title:"Testamentary trust (created by the will)",why:"A trust set out inside the will itself, which only comes into being on death \u2014 unlike a living trust, nothing needs to be transferred or funded, and there are no lifetime trustee fees. Commonly used to hold a minor child's or dependant's inheritance and release it in stages (for example at 21, 25 and 30) instead of all at once. Mark N/A if not applicable."},{id:"business_trust",group:"Trusts and structures",title:"Business trust / holding structure for succession",why:"A trust or holding company that owns the business interests, so ownership and control pass as intended instead of being split among heirs. Mark N/A if there is no business."},{id:"business_agreement",group:"Trusts and structures",title:"Shareholder / partnership agreement and key-person cover",why:"Buy-sell terms, who steps in, and funding for a buy-out. Mark N/A if there is no business."},{id:"foundation",group:"Trusts and structures",title:"Foundation / family office structure reviewed",why:t==="MY"?"For substantial or business wealth, assets may be held through a private foundation (for example a Labuan Foundation under the Labuan Foundations Act 2010, or its Shariah-compliant equivalent) or coordinated through a family office. These are governed by their own charter, not the will or default law \u2014 confirm how the structure coordinates with the rest of the estate plan. If wealth was built up while working in Singapore, a Singapore single family office (for example under the Section 13O or 13U tax schemes) may also be relevant. Mark N/A if not applicable. Record the holding in the Assets tab as \u201CHeld via a foundation / family office.\u201D":"For substantial wealth, a single family office (for example one structured under the Section 13O or 13U tax schemes) may hold and govern assets outside the will, sometimes alongside a foundation set up elsewhere. Confirm how the structure coordinates with the rest of the estate plan. Mark N/A if not applicable. Record the holding in the Assets tab as \u201CHeld via a foundation / family office.\u201D"},{id:"foreign_assets",group:"Trusts and structures",title:"Foreign assets and cross-border probate reviewed",why:`It is common for Malaysians who have worked abroad \u2014 most often in Singapore \u2014 to hold CPF savings, a bank or brokerage account, an insurance policy, or even property there. Mark each one "Held outside Malaysia" in the Assets tab so it is checked separately. A Malaysian grant of probate generally does not, by itself, let the executor deal with assets in another country \u2014 a separate grant (or resealing of the Malaysian grant) is usually needed there. Property located abroad is normally governed by that country's own succession law, not Malaysia's, regardless of the Malaysian will. Mark N/A if they have no assets outside Malaysia.`}];return e?(l.push({id:"hibah",group:"Trusts and structures",title:"Hibah (lifetime gifts) documented",why:"A completed gift during life can pass outside faraid. It needs clear intent, acceptance and proper documentation, and can be challenged if it looks like a disguised will."}),l.push({id:"charity",group:"Trusts and structures",title:"Wakaf / sadaqah jariah (optional)",why:"Endowments can be made in life, or by wasiat within
